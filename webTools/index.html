        .ツール一覧 {
            display: grid;

        }

        .ツール {
            display: grid;
            place-items: center;
        }

        .ツール > * {
            grid-area: 1 / 1;
        }

        .ツール img {
            display: block;
            width: 100%;

            filter: grayscale(1);
        }

        .ツール:hover img {
            filter: none;
        }

        .ツール名 {
            text-align: center;
            font-size: 1.2em;
        }

        a {
            z-index: 1;
            line-height: 1.2;
        }
